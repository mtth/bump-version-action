name: Bump version
description: |
  Bump version using semver and conventional commits.
inputs:
  token:
    description: |
      API token used to create version tags.
    required: false
    default: ${{ github.token }}
  custom-bumps:
    description: |
      Newline-separated list of bumps and regular expressions to derive the
      version bump of commits which don't have a title in conventional commit
      format. This is useful for messages which are automatically generated,
      for example merges and pass CLI commits. The format of each line is
      `<bump><space><regex>`.
    required: false
    default: |
      minor ^(Merge|Revert)\s
  ignore-breaking:
    description: |
      If true, ignore the breaking change marker (!) when deriving the bump.
      The default is false, unless the version is pre-1.0.
    required: false
runs:
  using: node20
  main: index.js
